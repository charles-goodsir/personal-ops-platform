services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Localhost only. Other services reach it over the compose network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: personal-ops:local # built by mcp-server
    pull_policy: never
    command:
      [
        "packages/core/node_modules/.bin/node-pg-migrate",
        "--migrations-dir",
        "packages/core/migrations",
        "up",
      ]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  mcp-server:
    image: personal-ops:local
    build: .
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3000
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MCP_AUTH_TOKENS: ${MCP_AUTH_TOKENS:?set in .env}
      # search_notes embeds the query with the same model as the notes.
      OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
    # Host address to publish on: 127.0.0.1 locally, the LAN IP on the mini PC.
    ports:
      - "${MCP_PUBLISH_ADDR:-127.0.0.1}:${MCP_HTTP_PORT:-3000}:3000"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully

  # Nightly pg_dump to BACKUP_DIR on the host. Same image as db, so pg_dump
  # matches the server version. Runs as the host user so dumps aren't root-owned.
  backup:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    entrypoint: ["/backup.sh"]
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: Pacific/Auckland
      RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-14}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy

  # Syncs accounts and transactions from Akahu at startup and every 6 hours.
  finance:
    image: personal-ops:local
    pull_policy: never
    command: ["node", "packages/finance/dist/finance-main.js"]
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AKAHU_APP_TOKEN: ${AKAHU_APP_TOKEN:?set in .env}
      AKAHU_USER_TOKEN: ${AKAHU_USER_TOKEN:?set in .env}
      # Optional: without a key, transactions sync but only my rules categorise them.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_BULK_MODEL: ${CLAUDE_BULK_MODEL:-claude-haiku-5-5}
      FINANCE_HISTORY_START: ${FINANCE_HISTORY_START:-2026-01-01}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Sends the weekly spending summary to Telegram, Monday 08:00 NZ.
  summary:
    image: personal-ops:local
    pull_policy: never
    command: ["node", "packages/finance/dist/summary-main.js"]
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set in .env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set in .env}
      # Optional: without a key the summary is plain numbers.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_SUMMARY_MODEL: ${CLAUDE_SUMMARY_MODEL:-claude-sonnet-5-5}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Sends the daily briefing to Telegram at BRIEFING_TIME (NZ): finance,
  # notes and weather. A section that fails is skipped.
  briefing:
    image: personal-ops:local
    pull_policy: never
    command: ["node", "packages/briefing/dist/briefing-main.js"]
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set in .env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set in .env}
      BRIEFING_TIME: ${BRIEFING_TIME:-07:00}
      WEATHER_LAT: ${WEATHER_LAT:?set in .env}
      WEATHER_LON: ${WEATHER_LON:?set in .env}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Answers my Telegram commands (/spend, /subs, /notes, /briefing). Polls
  # Telegram, so it only makes outbound calls and publishes no port. Messages
  # from any chat but mine are ignored.
  bot:
    image: personal-ops:local
    pull_policy: never
    command: ["node", "packages/bot/dist/bot-main.js"]
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set in .env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set in .env}
      # /briefing builds the same sections as the daily briefing.
      WEATHER_LAT: ${WEATHER_LAT:?set in .env}
      WEATHER_LON: ${WEATHER_LON:?set in .env}
      # /notes embeds the query with the same model as the notes.
      OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      # Optional: the watchdog pings this after each check, so an outside
      # service alerts me if the bot or Telegram goes down.
      HEALTHCHECK_PING_URL: ${HEALTHCHECK_PING_URL:-}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully

  # Indexes the notes folder: full scan at startup, then watches for changes.
  knowledge-base:
    image: personal-ops:local
    pull_policy: never
    command: ["node", "packages/knowledge-base/dist/watch-main.js"]
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      NOTES_DIR: /notes
    volumes:
      # Host folder from NOTES_DIR in .env. Read-only: indexing never edits notes.
      - ${NOTES_DIR:-./notes}:/notes:ro
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully

  # Embeddings model server. No published port: only reachable from other
  # services on the compose network, so notes never leave the box.
  ollama:
    image: ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    mem_limit: 2g
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: downloads the model into the ollama volume. A no-op once it is there.
  ollama-pull:
    image: ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    command: ["pull", "${EMBED_MODEL:-nomic-embed-text}"]
    environment:
      OLLAMA_HOST: ollama:11434
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
