version: 2

# Version updates, weekly. Every update is a pull request that runs CI and the
# audit, and I merge each one myself. The 7 day cooldown means I never take a
# release that is less than a week old, because a compromised release is
# usually found within days.
updates:
  - package-ecosystem: npm
    directories: ["/", "/packages/*"]
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Pacific/Auckland
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # The runtime is Node 24, so the types stay on the 24 line. A new Node
      # major is a deliberate change that moves .nvmrc, the Dockerfile and this.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch updates arrive as one pull request. A major update
      # stays on its own, because it can break the build.
      minor-and-patch:
        update-types: [minor, patch]

  # Keeps the commit SHAs that the workflows are pinned to current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Pacific/Auckland
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # The base image digest in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Pacific/Auckland
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # The database and Ollama images in the compose file.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Pacific/Auckland
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # Ollama is before 1.0, so a minor version can change how notes are
      # embedded, and CI never runs it. I update it by hand and try it on the
      # box. Patch updates still come through.
      - dependency-name: "ollama/ollama"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
