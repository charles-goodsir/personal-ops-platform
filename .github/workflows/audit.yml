name: Audit

# Known vulnerabilities in the dependencies. Separate from the CI check so that
# an npm registry outage cannot block a merge, and scheduled because a quiet
# repo gets no pull requests and would never notice a new advisory.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 19 * * 1" # Tuesday 08:17 NZDT, 07:17 NZST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      # What runs in the containers. A high or critical advisory fails the job.
      - run: pnpm audit --prod --audit-level=high
      # The build and test tools too, for the log only.
      - run: pnpm audit
        continue-on-error: true
